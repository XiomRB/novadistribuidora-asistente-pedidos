name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MLFLOW_DISABLE_AGENT_HINT: "1"
      LANGSMITH_TRACING: "false"
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7

      - name: Configurar Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar dependencias desde los bloqueos
        run: |
          python -m pip install pip==26.0.1
          pip install --no-deps -r requirements-dev.txt
          pip check

      - name: Verificar que lo instalado coincide con los bloqueos
        run: |
          diff <(pip freeze | tr A-Z a-z | sort) <(grep -h '==' requirements.txt requirements-dev.txt | tr A-Z a-z | sort)

      - name: Ejecutar pruebas
        run: python -m pytest -v -p no:cacheprovider
